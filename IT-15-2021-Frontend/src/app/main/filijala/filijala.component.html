<mat-toolbar color="accent">
    <span class="title-center">Filijala</span>
  </mat-toolbar>
  
  <div class="container mat-elavation-z8">
    <mat-table [dataSource]="dataSource" class="mat-cell">
      <!--ID-->
      <ng-container matColumnDef="id">
        <mat-header-cell *matHeaderCellDef>ID</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.id }}</mat-cell>
      </ng-container>
      <!--Adresa-->
      <ng-container matColumnDef="adresa">
        <mat-header-cell *matHeaderCellDef>Adresa filijale</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.adresa }}</mat-cell>
      </ng-container>
      <!-- Broj pultova -->
      <ng-container matColumnDef="brojPultova">
        <mat-header-cell *matHeaderCellDef>Broj pultova</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.brojPultova }}</mat-cell>
      </ng-container>
      <!-- Poseduje sef -->
      <ng-container matColumnDef="posedujeSef">
        <mat-header-cell *matHeaderCellDef>Poseduje sef</mat-header-cell>
        <mat-cell *matCellDef="let row" [style.color]="row.posedujeSef == true ? 'green' : 'red'">{{ row.posedujeSef ? 'Da' : 'Ne' }}</mat-cell>
      </ng-container>
      <!-- Poseduje sef -->
      <ng-container matColumnDef="banka">
        <mat-header-cell *matHeaderCellDef>Banka</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.banka.naziv }}</mat-cell>
      </ng-container>
      <!-- Action Buttons -->
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef>
          <button (click)="openDialog(1)" mat-icon-button color="accent">
            <mat-icon>add</mat-icon>
          </button>
        </mat-header-cell>
        <mat-cell *matCellDef="let row; let i = index">
          <button (click)="openDialog(2, row.id, row.adresa,row.brojPultova,row.posedujeSef, row.banka)" mat-icon-button color="primary">
            <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
          </button>
          <button (click)="openDialog(3, row.id, row.adresa,row.brojPultova,row.posedujeSef, row.banka)" mat-icon-button color="primary">
            <mat-icon color= "warn" aria-label="Delete">delete</mat-icon>
          </button>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row
        style="cursor: pointer;"
        *matRowDef="let row; columns: displayedColumns">
      </mat-row>
    </mat-table>
  </div>
